# Render Blueprint — https://render.com/docs/blueprint-spec
# Create via: Render dashboard → New → Blueprint → select this repo.
services:
  - type: web
    name: kanban-board
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    # Deploys are triggered by GitHub Actions (deploy hook) after CI passes,
    # not on every raw push.
    autoDeploy: false
    healthCheckPath: /healthz
    # Render exposes env vars to the Docker build, where our Dockerfile
    # declares them as ARGs. Both values are public by design (they ship
    # in the JS bundle); RLS is the security boundary.
    envVars:
      - key: VITE_SUPABASE_URL
        value: https://kzwbhrbbyawvjlyihioc.supabase.co
