server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Security headers (declared at server level; locations below avoid
    # add_header so these are inherited everywhere).
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Optional hardening — uncomment and replace <project-ref> with your
    # Supabase ref, then verify the app still loads before shipping:
    # add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://<project-ref>.supabase.co wss://<project-ref>.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; base-uri 'self'; frame-ancestors 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Health check for load balancers / App Runner / ECS
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Hashed build assets — safe to cache forever ("expires" keeps the
    # server-level security headers inherited, unlike add_header).
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # SPA fallback: every route is served by index.html, which must
    # always be revalidated so deploys take effect immediately.
    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
